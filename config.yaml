# Status Report Generator v2 - settings (spec SRG-R13.1)
# One row for each team: the Jira project key and the team name.
# Change the example teams below to your own projects.
teams:
  - key: ALP
    name: Alpha
  - key: BET
    name: Beta

# All settings below are optional. The value shown is the default.

# Time zone for "today", the 14-day window and the "as of" time.
# Default: the time zone of this computer.
timezone: America/Toronto

# Work types that the tool counts. Epics and sub-tasks are not counted.
work_types: [Story, Task, Bug]

# Match of Jira priority names to P1 to P5. P1 and P2 are "high priority".
# Use a list if your team has more than one name for a level, for example:
#   P1: [Highest, Blocker]
# A ticket with a priority that is not here is not high priority, and the tool
# shows a warning with the ticket key.
priority_map:
  P1: Highest
  P2: High
  P3: Medium
  P4: Low
  P5: Lowest

# How the tool finds a blocked ticket. Use one or more of:
#   status - the ticket is in the status named in blocked_status_name
#   flag   - the ticket has the Jira flag
#   label  - the ticket has the label named in blocked_label
blocked_method: [status]
blocked_status_name: Blocked
blocked_label: blocked

# Amber: due within this many days and not started (status category To Do).
amber_window_days: 2

# Show the 85% forecast date for each team (needs 12 weeks of history).
forecast: true

# Folder for the reports. Git ignores it.
output_folder: output

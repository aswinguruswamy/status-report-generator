[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "status-report-generator"
version = "1.0.0"
description = "Team status table from Jira: rule-based colours, reasons, forecast and a Markdown report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "PyYAML",
    "python-dotenv",
    "mcf @ git+https://github.com/aswinguruswamy/monte-carlo-delivery-forecast@8b3ffbb130a1a3764c8a99d06a8292946a3e5ffe",
]

[project.scripts]
status-report = "status_report.cli:main"

[tool.setuptools.packages.find]
include = ["status_report*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

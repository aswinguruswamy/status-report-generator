[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "status-report-generator"
version = "0.1.0"
description = "Reads Jira and writes a weekly status report with RAG status and an AI summary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "PyYAML",
    "python-dotenv",
    "anthropic",
]

[project.scripts]
status-report = "status_report.cli:main"

[tool.setuptools.packages.find]
include = ["status_report*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
